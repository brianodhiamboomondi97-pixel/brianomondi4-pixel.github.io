<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotticonnect – Find and book hotels</title>
<style>
  /* 1. COLOURS – change these to restyle the whole site */
  :root{--bg:#0a2016;--card:#0f2c1e;--line:#25523a;--fg:#eaf7ee;--mut:#9dbba9;--acc:#6fe3a2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:28px 20px;border-bottom:1px solid var(--line)}
  .wrap{max-width:760px;margin:0 auto}
  h1{margin:0;font-size:34px;letter-spacing:-.02em}
  h1 span{color:var(--acc)}
  header p{margin:6px 0 0;color:var(--mut)}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
  input,select,button{font:inherit;padding:11px 13px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
  .tools input{flex:1;min-width:180px}
  button{cursor:pointer;background:var(--acc);color:var(--bg);font-weight:600;border:0}
  .hotel{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:16px 18px;margin-bottom:14px}
  .hotel h2{margin:0 0 4px;font-size:20px}
  .hotel p{margin:0 0 10px;color:var(--mut)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;width:min(92vw,420px)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  form{display:grid;gap:12px}
  label{font-weight:600;font-size:15px;display:block;margin-bottom:4px}
  form input,form select{width:100%}
  .ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .btns{display:flex;gap:8px}
  .menuitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .menuitem small{color:var(--mut)}
  .qty{display:flex;align-items:center;gap:10px}
  .qty button{padding:4px 14px}
  .total{font-weight:700;margin:4px 0}
  [hidden]{display:none!important}
  .btns{flex-wrap:wrap}
  .ghost.on{border-color:var(--acc);color:var(--acc)}
  .bubble{margin:6px 0;padding:8px 12px;border-radius:10px;max-width:85%}
  .me{background:var(--acc);color:var(--bg);margin-left:auto}
  .them{background:var(--line)}
  #chatBox{max-height:260px;overflow:auto;display:flex;flex-direction:column}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .stats div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--mut)}
  .stats b{display:block;color:var(--fg);font-size:20px}
  .rec{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:10px}
  .rec small{color:var(--mut)}
  .reply{display:flex;gap:8px;margin-top:8px}
  .reply input{flex:1;min-width:0}
  #msg{color:var(--acc);margin:0;min-height:1.4em}
</style>
</head>
<body>

<!-- 2. HEADER -->
<header><div class="wrap">
  <h1>Hotti<span>connect</span></h1>
  <p>Choose a hotel, then book a room, a meeting space, or order food.</p>
  <div class="btns" style="margin-top:14px"><button class="ghost on" id="vGuest" type="button">Guest</button><button class="ghost" id="vMgmt" type="button" hidden>Management</button><button class="ghost" id="authBtn" type="button">Sign in</button></div>
  <small id="who" style="display:block;margin-top:8px;color:var(--mut)"></small>
</div></header>
<p id="dbmsg" role="status" style="margin:0;padding:8px 20px;color:var(--acc)"></p>

<main class="wrap" id="guest">
  <!-- 3. SEARCH AND FILTER -->
  <div class="tools">
    <input id="search" type="search" placeholder="Search hotels…" aria-label="Search hotels">
    <select id="city" aria-label="Filter by city"><option value="">All cities</option></select>
  </div>

  <!-- 4. HOTEL LIST (JavaScript fills this in) -->
  <div id="list"></div>
</main>

<!-- MANAGEMENT VIEW (JavaScript fills this in) -->
<main class="wrap" id="mgmt" hidden></main>

<!-- 5. BOOKING POP-UP -->
<dialog id="book">
  <form id="bookForm">
    <h2 id="bookTitle" style="margin:0">Book</h2>
    <div><label for="name">Your name</label><input id="name" required></div>
    <div><label for="type">What are you booking?</label>
      <select id="type"><option>Room</option><option>Meeting space</option></select></div>
    <div><label for="date">Date</label><input id="date" type="date" required></div>
    <p id="msg" role="status"></p>
    <div class="row"><button type="button" class="ghost" id="close">Close</button><button type="submit">Confirm booking</button></div>
  </form>
</dialog>

<!-- 5b. FOOD ORDER POP-UP -->
<dialog id="food">
  <form id="foodForm">
    <h2 id="foodTitle" style="margin:0">Order food</h2>
    <div id="menu"></div>
    <p class="total" id="total"></p>
    <div><label for="room">Room or table number</label><input id="room" required></div>
    <p id="foodMsg" role="status" style="color:var(--acc);margin:0;min-height:1.4em"></p>
    <div class="row"><button type="button" class="ghost" id="foodClose">Close</button><button type="submit">Place order</button></div>
  </form>
</dialog>

<!-- 5c. PAYMENT POP-UP (demo) -->
<dialog id="pay">
  <form id="payForm">
    <h2 style="margin:0">Payment</h2>
    <p id="payAmt" style="margin:0"></p>
    <div><label for="payMethod">Payment method</label>
      <select id="payMethod"><option value="mpesa">M-Pesa</option><option value="card">Card</option><option value="later">Pay when I arrive</option></select></div>
    <div><label for="payPhone">Phone number (for M-Pesa)</label><input id="payPhone" type="tel" placeholder="07XX XXX XXX"></div>
    <p style="margin:0;color:var(--mut);font-size:14px">Demo only. No real money is charged.</p>
    <p id="payMsg" role="status" style="color:var(--acc);margin:0;min-height:1.4em"></p>
    <div class="row"><button type="button" class="ghost" id="payClose">Close</button><button type="submit">Pay now</button></div>
  </form>
</dialog>

<!-- 5d. CHAT POP-UP -->
<dialog id="chat">
  <form id="chatForm">
    <h2 id="chatTitle" style="margin:0">Chat</h2>
    <div id="chatBox"></div>
    <div class="reply"><input id="chatIn" placeholder="Type a message…" aria-label="Message"><button>Send</button></div>
    <button type="button" class="ghost" id="chatClose">Close</button>
  </form>
</dialog>

<!-- 5e. SIGN IN / CREATE ACCOUNT -->
<dialog id="auth">
  <form id="authForm">
    <h2 id="authTitle" style="margin:0">Sign in</h2>
    <div><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" required></div>
    <div><label for="aPass">Password (6 or more characters)</label><input id="aPass" type="password" autocomplete="current-password" minlength="6" required></div>
    <p id="authMsg" role="status" style="color:var(--acc);margin:0;min-height:1.4em"></p>
    <div class="row"><button type="button" class="ghost" id="authClose">Close</button><button type="submit" id="authGo">Sign in</button></div>
    <button type="button" class="ghost" id="authSwap">New here? Create an account</button>
  </form>
</dialog>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, doc, getDoc, onSnapshot, writeBatch, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // 6. YOUR DATA – this is sample data. Replace it with real hotels later.
  const hotels = [
    {name:"Lakeview Grand", city:"Kisumu",  price:8500, rating:4.6, desc:"Lake views, restaurant and a large conference hall."},
    {name:"Savannah Suites", city:"Nairobi", price:12000, rating:4.4, desc:"Modern suites close to the city centre."},
    {name:"Coastline Resort", city:"Mombasa", price:15000, rating:4.7, desc:"Beachfront rooms with a pool and meeting rooms."},
    {name:"City Centre Inn", city:"Nairobi", price:5500, rating:4.1, desc:"Affordable rooms and a small meeting space."}
  ];

  const list = document.getElementById('list');
  const search = document.getElementById('search');
  const city = document.getElementById('city');
  const dlg = document.getElementById('book');
  let chosen = null;

  // fill the city dropdown from the data
  [...new Set(hotels.map(h => h.city))].forEach(c => city.add(new Option(c, c)));

  // draw the hotel cards
  function render() {
    const q = search.value.toLowerCase();
    const shown = hotels.filter(h =>
      (!city.value || h.city === city.value) &&
      (h.name + ' ' + h.city).toLowerCase().includes(q));
    list.innerHTML = shown.length ? '' : '<p>No hotels match your search.</p>';
    shown.forEach(h => {
      const d = document.createElement('div');
      d.className = 'hotel';
      d.innerHTML = `<h2>${h.name}</h2><p>${h.city} · ★ ${h.rating}<br>${h.desc}</p>
        <div class="row"><strong>KSh ${h.price.toLocaleString()} / night</strong><div class="btns"><button class="ghost" data-a="chat">Chat</button><button class="ghost" data-a="food">Order food</button><button data-a="book">Book</button></div></div>`;
      d.querySelector('[data-a=book]').onclick = () => openBooking(h);
      d.querySelector('[data-a=food]').onclick = () => openFood(h);
      d.querySelector('[data-a=chat]').onclick = () => openChat(h);
      list.appendChild(d);
    });
  }

  function openBooking(h) {
    if (!USER) return askLogin();
    chosen = h;
    document.getElementById('bookTitle').textContent = 'Book at ' + h.name;
    document.getElementById('msg').textContent = '';
    dlg.showModal();
  }

  document.getElementById('bookForm').addEventListener('submit', async e => {
    e.preventDefault();
    const n = document.getElementById('name').value.trim();
    const t = document.getElementById('type').value.toLowerCase();
    const d = document.getElementById('date').value;
    try {
      const rec = await addRecord('bookings', {who:n, hotel:chosen.name, what:t, date:d, amount: t === 'room' ? chosen.price : 5000});
      dlg.close();
      openPay('bookings', rec);
    } catch (err) { document.getElementById('msg').textContent = 'Could not save your booking. Check your internet and try again.'; }
  });

  // FOOD ORDERING – sample menu shared by all hotels (later: one menu per hotel)
  const MENU = [
    {n:"Chicken & chips", p:700}, {n:"Ugali & fish", p:900}, {n:"Vegetable pilau", p:600},
    {n:"Fresh juice", p:250}, {n:"Tea / coffee", p:150}
  ];
  const foodDlg = document.getElementById('food');
  let qty = [];

  function openFood(h) {
    if (!USER) return askLogin();
    chosen = h;
    qty = MENU.map(() => 0);
    document.getElementById('foodTitle').textContent = 'Order food at ' + h.name;
    document.getElementById('foodMsg').textContent = '';
    drawMenu();
    foodDlg.showModal();
  }

  function drawMenu() {
    const box = document.getElementById('menu');
    box.innerHTML = '';
    MENU.forEach((m, i) => {
      const r = document.createElement('div');
      r.className = 'menuitem';
      r.innerHTML = `<span>${m.n}<br><small>KSh ${m.p}</small></span>
        <div class="qty"><button type="button" class="ghost">−</button><b>${qty[i]}</b><button type="button">+</button></div>`;
      const [minus, plus] = r.querySelectorAll('button');
      minus.onclick = () => { if (qty[i] > 0) { qty[i]--; drawMenu(); } };
      plus.onclick = () => { qty[i]++; drawMenu(); };
      box.appendChild(r);
    });
    const total = MENU.reduce((s, m, i) => s + m.p * qty[i], 0);
    document.getElementById('total').textContent = 'Total: KSh ' + total.toLocaleString();
  }

  document.getElementById('foodForm').addEventListener('submit', async e => {
    e.preventDefault();
    const total = MENU.reduce((s, m, i) => s + m.p * qty[i], 0);
    const msg = document.getElementById('foodMsg');
    if (total === 0) { msg.textContent = 'Please add at least one item.'; return; }
    const items = MENU.map((m, i) => qty[i] ? qty[i] + '× ' + m.n : '').filter(Boolean).join(', ');
    try {
      const rec = await addRecord('orders', {hotel:chosen.name, items, to:document.getElementById('room').value, amount:total});
      qty = MENU.map(() => 0);
      foodDlg.close();
      openPay('orders', rec);
    } catch (err) { msg.textContent = 'Could not send the order. Check your internet and try again.'; }
  });
  document.getElementById('foodClose').onclick = () => foodDlg.close();

  document.getElementById('close').onclick = () => dlg.close();
  search.oninput = render;
  city.onchange = render;
  // FIREBASE – shared online database (Firestore)
  const app = initializeApp({
    apiKey: "AIzaSyDlyBdsznyct97ssTX-abG2VunGRTGv1wM",
    authDomain: "hotticonnect.firebaseapp.com",
    projectId: "hotticonnect",
    storageBucket: "hotticonnect.firebasestorage.app",
    messagingSenderId: "521357505843",
    appId: "1:521357505843:web:370ed92aaf00a5c38d3a46"
  });
  const fs = getFirestore(app);
  let DB = {bookings:[], orders:[], chats:{}, msgs:[]};
  let USER = null, IS_STAFF = false;   // set when someone signs in
  const dbErr = e => { console.error(e); document.getElementById('dbmsg').textContent = 'Could not reach the database. Check your internet connection and the Firestore rules.'; };
  async function addRecord(kind, r) {
    r.uid = USER.uid; r.email = USER.email;
    r.status = 'Unpaid'; r.time = new Date().toLocaleString(); r.created = Date.now();
    const ref = await addDoc(collection(fs, kind), r);
    r.id = ref.id; return r;
  }
  const money = n => 'KSh ' + n.toLocaleString();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const post = (hotel, guest, from, text) => addDoc(collection(fs, 'messages'), {hotel, guest, from, text, created: Date.now()}).catch(dbErr);

  // PAYMENT – demo only, no real money moves
  const payDlg = document.getElementById('pay');
  let payRec = null, payKind = '';
  function openPay(kind, rec) {
    payRec = rec; payKind = kind;
    document.getElementById('payAmt').textContent = money(rec.amount) + ' – ' + (kind === 'bookings' ? 'booking' : 'food order') + ' at ' + rec.hotel;
    document.getElementById('payMsg').textContent = '';
    payDlg.showModal();
  }
  document.getElementById('payForm').addEventListener('submit', async e => {
    e.preventDefault();
    const m = document.getElementById('payMethod').value, ph = document.getElementById('payPhone').value.replace(/\s/g, ''), msg = document.getElementById('payMsg');
    if (m === 'later') { msg.textContent = 'Saved. You can pay when you arrive.'; return; }
    if (m === 'mpesa' && !/^0?\d{9}$/.test(ph)) { msg.textContent = 'Enter a valid phone number.'; return; }
    try {
      await updateDoc(doc(fs, payKind, payRec.id), {status:'Paid', method:m});
      msg.textContent = 'Payment successful (demo). Thank you!';
    } catch (err) { msg.textContent = 'Could not save the payment. Please try again.'; }
  });
  document.getElementById('payClose').onclick = () => payDlg.close();

  // CHAT – guests write here, management replies in the Management view
  const chatDlg = document.getElementById('chat');
  let chatHotel = null;
  function drawChat() {
    const box = document.getElementById('chatBox'), ms = DB.chats[chatHotel + '|' + USER.uid] || [];
    box.innerHTML = ms.length ? '' : '<p>Say hello to the hotel team.</p>';
    ms.forEach(m => { const p = document.createElement('p'); p.className = 'bubble ' + (m.from === 'guest' ? 'me' : 'them'); p.textContent = m.text; box.appendChild(p); });
    box.scrollTop = box.scrollHeight;
  }
  function openChat(h) { if (!USER) return askLogin(); chatHotel = h.name; document.getElementById('chatTitle').textContent = 'Chat with ' + h.name; drawChat(); chatDlg.showModal(); }
  document.getElementById('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    const i = document.getElementById('chatIn'), t = i.value.trim(), hn = chatHotel;
    if (!t) return;
    post(hn, USER.uid, 'guest', t); i.value = '';
  });
  document.getElementById('chatClose').onclick = () => chatDlg.close();

  // MANAGEMENT VIEW – only staff accounts can open this
  const gv = document.getElementById('guest'), mv = document.getElementById('mgmt');
  function view(m) {
    gv.hidden = m; mv.hidden = !m;
    document.getElementById('vGuest').classList.toggle('on', !m);
    document.getElementById('vMgmt').classList.toggle('on', m);
    if (m) drawMgmt();
  }
  document.getElementById('vGuest').onclick = () => view(false);
  document.getElementById('vMgmt').onclick = () => { if (IS_STAFF) view(true); };

  function drawMgmt() {
    const all = [...DB.bookings, ...DB.orders];
    const sum = f => all.filter(f).reduce((s, r) => s + r.amount, 0);
    const rows = (a, f) => a.length ? a.slice().reverse().map(r =>
      `<div class="rec"><b>${f(r)}</b><br><small>${esc(r.time)} · ${money(r.amount)} · ${r.status}${r.method ? ' (' + esc(r.method) + ')' : ''}</small></div>`).join('') : '<p>Nothing yet.</p>';
    mv.innerHTML = `<h2>Activity</h2>
      <div class="stats"><div><b>${DB.bookings.length}</b>Bookings</div><div><b>${DB.orders.length}</b>Food orders</div>
      <div><b>${money(sum(r => r.status === 'Paid'))}</b>Paid</div><div><b>${money(sum(r => r.status !== 'Paid'))}</b>Unpaid</div></div>
      <h3>Bookings</h3>${rows(DB.bookings, r => `${esc(r.who)} – ${esc(r.what)} at ${esc(r.hotel)} on ${esc(r.date)}`)}
      <h3>Food orders</h3>${rows(DB.orders, r => `${esc(r.items)} → ${esc(r.to)}, ${esc(r.hotel)}`)}
      <h3>Customer chats</h3><div id="chats"></div>
      <p><button class="ghost" id="clr" type="button">Clear demo data</button></p>`;
    const cbox = document.getElementById('chats'), names = Object.keys(DB.chats);
    if (!names.length) cbox.textContent = 'No chats yet.';
    names.forEach(hn => {
      const w = document.createElement('div'); w.className = 'rec';
      const [hName, gid] = hn.split('|');
      const t = document.createElement('b'); t.textContent = hName + ' · guest ' + gid.slice(-4); w.appendChild(t);
      DB.chats[hn].forEach(m => { const p = document.createElement('p'); p.className = 'bubble ' + (m.from === 'guest' ? 'me' : 'them'); p.textContent = (m.from === 'guest' ? 'Guest: ' : 'Management: ') + m.text; w.appendChild(p); });
      const f = document.createElement('form'); f.className = 'reply';
      const i = document.createElement('input'); i.placeholder = 'Reply…'; i.setAttribute('aria-label', 'Reply to ' + hn);
      const b = document.createElement('button'); b.textContent = 'Send';
      f.append(i, b);
      f.onsubmit = e => { e.preventDefault(); const v = i.value.trim(); if (v) { i.value = ''; i.blur(); post(hName, gid, 'mgmt', v); } };
      w.appendChild(f); cbox.appendChild(w);
    });
    document.getElementById('clr').onclick = async () => {
      if (!confirm('Delete ALL bookings, orders and chats from the database?')) return;
      try {
        const b = writeBatch(fs);
        DB.bookings.forEach(r => b.delete(doc(fs, 'bookings', r.id)));
        DB.orders.forEach(r => b.delete(doc(fs, 'orders', r.id)));
        DB.msgs.forEach(m => b.delete(doc(fs, 'messages', m.id)));
        await b.commit();
      } catch (err) { dbErr(err); }
    };
  }

  // LIVE UPDATES – staff see everything, guests only see their own records
  const refreshMgmt = () => { if (!mv.hidden && !mv.contains(document.activeElement)) drawMgmt(); };
  let unsubs = [];
  function startWatching() {
    unsubs.forEach(u => u()); unsubs = [];
    DB = {bookings:[], orders:[], chats:{}, msgs:[]};
    if (!USER) return;
    const scope = (name, field) => IS_STAFF ? collection(fs, name) : query(collection(fs, name), where(field, '==', USER.uid));
    const sorted = snap => snap.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => (a.cre
