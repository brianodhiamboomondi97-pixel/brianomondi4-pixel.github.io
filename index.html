<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotticonnect – Find and book hotels</title>
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a5fe0">
<link rel="icon" href="icon.svg" type="image/svg+xml"></head>
<body>

<header><div class="wrap">
  <h1>Hotti<span>connect</span></h1>
  <p>Choose a hotel, then book a room, a meeting space, or order food.</p>
  <div class="btns" style="margin-top:14px"><button class="ghost on" id="vGuest" type="button">Guest</button><button class="ghost" id="vMgmt" type="button" hidden>Management</button><button class="ghost" id="authBtn" type="button">Sign in</button></div>
  <small id="who" style="display:block;margin-top:8px;color:var(--mut)"></small>
</div></header>
<p id="dbmsg" role="status" style="margin:0;padding:8px 20px;color:var(--acc)"></p>

<main class="wrap" id="guest">
  <div class="tools">
    <input id="search" type="search" placeholder="Search hotels…" aria-label="Search hotels">
    <select id="city" aria-label="Filter by city"><option value="">All cities</option></select>
  </div>
  <div id="list"></div>
</main>
<main class="wrap" id="mgmt" hidden></main>

<dialog id="book">
  <form id="bookForm">
    <h2 id="bookTitle" style="margin:0">Book</h2>
    <div><label for="name">Your name</label><input id="name" required></div>
    <div><label for="type">What are you booking?</label>
      <select id="type"><option>Room</option><option>Meeting space</option></select></div>
    <div><label for="date">Date</label><input id="date" type="date" required></div>
    <p id="msg" role="status"></p>
    <div class="row"><button type="button" class="ghost" id="close">Close</button><button type="submit">Confirm booking</button></div>
  </form>
</dialog>

<dialog id="food">
  <form id="foodForm">
    <h2 id="foodTitle" style="margin:0">Order food</h2>
    <div id="menu"></div>
    <p class="total" id="total"></p>
    <div><label for="room">Room or table number</label><input id="room" required></div>
    <p id="foodMsg" role="status" style="color:var(--acc);margin:0;min-height:1.4em"></p>
    <div class="row"><button type="button" class="ghost" id="foodClose">Close</button><button type="submit">Place order</button></div>
  </form>
</dialog>

<dialog id="pay">
  <form id="payForm">
    <h2 style="margin:0">Payment</h2>
    <p id="payAmt" style="margin:0"></p>
    <div><label for="payMethod">Payment method</label>
      <select id="payMethod"><option value="mpesa">M-Pesa</option><option value="card">Card</option><option value="later">Pay when I arrive</option></select></div>
    <div><label for="payPhone">Phone number (for M-Pesa)</label><input id="payPhone" type="tel" placeholder="07XX XXX XXX"></div>
    <p style="margin:0;color:var(--mut);font-size:14px">Demo only. No real money is charged.</p>
    <p id="payMsg" role="status" style="color:var(--acc);margin:0;min-height:1.4em"></p>
    <div class="row"><button type="button" class="ghost" id="payClose">Close</button><button type="submit">Pay now</button></div>
  </form>
</dialog>

<dialog id="chat">
  <form id="chatForm">
    <h2 id="chatTitle" style="margin:0">Chat</h2>
    <div id="chatBox"></div>
    <div class="reply"><input id="chatIn" placeholder="Type a message…" aria-label="Message"><button>Send</button></div>
    <button type="button" class="ghost" id="chatClose">Close</button>
  </form>
</dialog>

<dialog id="auth">
  <form id="authForm">
    <h2 id="authTitle" style="margin:0">Sign in</h2>
    <div><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" required></div>
    <div><label for="aPass">Password (6 or more characters)</label><input id="aPass" type="password" autocomplete="current-password" minlength="6" required></div>
    <p id="authMsg" role="status" style="color:var(--acc);margin:0;min-height:1.4em"></p>
    <div class="row"><button type="button" class="ghost" id="authClose">Close</button><button type="submit" id="authGo">Sign in</button></div>
    <button type="button" class="ghost" id="authSwap">New here? Create an account</button>
  </form>
</dialog>

<dialog id="hotelDlg">
  <form id="hotelForm">
    <h2 id="hotelTitle" style="margin:0">Hotel</h2>
    <div><label for="hn">Hotel name</label><input id="hn" required></div>
    <div><label for="hc">City</label><input id="hc" required></div>
    <div><label for="hp">Room price per night (KSh)</label><input id="hp" type="number" min="0" required></div>
    <div><label for="hm">Meeting space price (KSh)</label><input id="hm" type="number" min="0"></div>
    <div><label for="hr">Rating (0 to 5)</label><input id="hr" type="number" min="0" max="5" step="0.1"></div>
    <div><label for="hph">Photo link (starts with https://)</label><input id="hph" type="url"></div>
    <div><label for="hd">Description</label><textarea id="hd" rows="2"></textarea></div>
    <div><label for="hmenu">Food menu: one dish per line, like Ugali &amp; fish, 900</label><textarea id="hmenu" rows="5"></textarea></div>
    <p id="hMsg" role="status" style="color:var(--acc);margin:0;min-height:1.4em"></p>
    <div class="row"><button type="button" class="ghost" id="hotelClose">Close</button><button type="submit">Save hotel</button></div>
  </form>
</dialog>

<script type="module" src="app.js"><script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}))</script></script>
</body>
  </html>
