<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotticonnect – Find and book hotels</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a5fe0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>

<header><div class="wrap">
  <h1>Hotti<span>connect</span></h1>
  <p>Choose a hotel, then book a room, a meeting space, or order food.</p>
  <div class="btns" style="margin-top:14px"><button class="ghost on" id="vGuest" type="button">Guest</button><button class="ghost" id="vMgmt" type="button" hidden>Management</button><button class="ghost" id="vMine" type="button" hidden>My bookings</button><button class="ghost" id="authBtn" type="button">Sign in</button></div>
  <small id="who" style="display:block;margin-top:8px;color:var(--mut)"></small>
</div></header>
<p id="dbmsg" role="status" style="margin:0;padding:8px 20px;color:var(--acc)"></p>

<main class="wrap" id="guest">
  <div class="tools">
    <input id="search" type="search" placeholder="Search hotels…" aria-label="Search hotels">
